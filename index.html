<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SF Handdoek Check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Bodoni:wght@600;700&family=Hanken+Grotesk:wght@400;500;600&display=swap">

<style>
/* ── Tokens ─────────────────────────────────────────────────────── */
:root {
  --bg:     #1b1d1e;
  --surf:   #252729;
  --surf2:  #2e3032;
  --border: #383a3c;
  --fg:     #f3eae5;
  --muted:  #7a6a5f;
  --accent: #8b2252;
  --accent2:#a82a65;
  --green:  #1a7a4a;
  --greenl: #16a34a;
  --red:    #c0292a;
  --redl:   #dc2626;
  --fd:     'Libre Bodoni', Georgia, serif;
  --fb:     'Hanken Grotesk', system-ui, sans-serif;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }

body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--fb);
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
}

/* ── Header ─────────────────────────────────────────────────────── */
.hd {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 0 12px;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border);
}

.brand-logo { height: 34px; width: auto; display: block; }

.hd-r { display: flex; align-items: center; gap: 10px; }

.pill {
  background: var(--surf);
  border: 1px solid var(--border);
  border-radius: 99px;
  padding: 4px 12px;
  font-size: 12px;
  font-weight: 500;
  color: var(--muted);
}
.pill b { color: var(--fg); font-variant-numeric: tabular-nums; }

.icon-btn {
  background: none;
  border: 1px solid var(--border);
  color: var(--muted);
  border-radius: 8px;
  padding: 6px 10px;
  font-size: 13px;
  font-family: var(--fb);
  cursor: pointer;
}
.icon-btn:hover { color: var(--fg); border-color: var(--muted); }

/* ── Scanner ─────────────────────────────────────────────────────── */
.scanner {
  position: relative;
  flex: 1 1 0;
  min-height: 0;
  border-radius: 12px;
  overflow: hidden;
  background: #000;
}

#video { width: 100%; height: 100%; object-fit: cover; display: block; }
#canvas { display: none; }

/* Scan guide overlay */
.guide {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 18px;
  pointer-events: none;
}
.guide[hidden] { display: none; }

.scan-box {
  width: min(210px, 48vw);
  height: min(210px, 48vw);
  position: relative;
}

/* Corner brackets */
.scan-box::before, .scan-box::after,
.scan-corners::before, .scan-corners::after {
  content: '';
  position: absolute;
  width: 28px; height: 28px;
  border-style: solid;
  border-color: #fff;
  border-width: 0;
  opacity: .75;
}
.scan-box::before   { top: 0; left: 0;  border-top-width: 3px; border-left-width: 3px;  border-radius: 3px 0 0 0; }
.scan-box::after    { top: 0; right: 0; border-top-width: 3px; border-right-width: 3px; border-radius: 0 3px 0 0; }
.scan-corners::before { bottom: 0; left: 0;  border-bottom-width: 3px; border-left-width: 3px;  border-radius: 0 0 0 3px; }
.scan-corners::after  { bottom: 0; right: 0; border-bottom-width: 3px; border-right-width: 3px; border-radius: 0 0 3px 0; }

@keyframes scanline { 0%,100% { top: 6%; opacity: .4; } 50% { top: 88%; opacity: .9; } }
.scan-line {
  position: absolute;
  left: 4px; right: 4px; height: 2px;
  background: var(--accent2);
  box-shadow: 0 0 10px 3px rgba(139,34,82,.6);
  animation: scanline 2.2s ease-in-out infinite;
}

.guide p {
  color: rgba(255,255,255,.55);
  font-size: 13px;
  font-family: var(--fb);
  text-align: center;
  padding: 0 20px;
}

/* ── Flash ───────────────────────────────────────────────────────── */
.flash {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px 24px 28px;
  gap: 0;
  overflow-y: auto;
}
.flash[hidden] { display: none; }
.flash.ok   { background: rgba(26,122,74,.95); }
.flash.warn { background: rgba(139,34,82,.95); }

.fi { font-size: 60px; line-height: 1; margin-bottom: 14px; }

.ft {
  font-family: var(--fd);
  font-size: 32px;
  font-weight: 700;
  color: #fff;
  margin-bottom: 8px;
  text-wrap: balance;
  text-align: center;
}

.fs {
  font-size: 15px;
  font-family: var(--fb);
  color: rgba(255,255,255,.85);
  text-align: center;
  margin-bottom: 22px;
  font-weight: 500;
}

.fbtns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }

.btn {
  border: none;
  border-radius: 9px;
  padding: 12px 22px;
  font-size: 14px;
  font-weight: 600;
  font-family: var(--fb);
  cursor: pointer;
}
.btn-w  { background: rgba(255,255,255,.18); color: #fff; }
.btn-w:hover { background: rgba(255,255,255,.28); }
.btn-wr { background: #fff; color: var(--accent); }

/* ── Naam-koppeling in green flash ──────────────────────────────── */
.fl-link {
  margin-top: 20px;
  padding-top: 18px;
  border-top: 1px solid rgba(255,255,255,.18);
  width: 100%;
  max-width: 340px;
  text-align: left;
  flex-shrink: 0;
}

.fl-link-label {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .1em;
  color: rgba(255,255,255,.45);
  margin-bottom: 9px;
  font-family: var(--fb);
}

.fl-link-row {
  display: flex;
  gap: 8px;
  align-items: stretch;
}

.fl-input {
  flex: 1 1 0;
  min-width: 0;
  background: rgba(0,0,0,.25);
  border: 1px solid rgba(255,255,255,.22);
  color: #fff;
  border-radius: 9px;
  padding: 10px 13px;
  font-size: 14px;
  font-family: var(--fb);
  -moz-appearance: textfield;
}
.fl-input::-webkit-outer-spin-button,
.fl-input::-webkit-inner-spin-button { -webkit-appearance: none; }
.fl-input::placeholder { color: rgba(255,255,255,.3); }
.fl-input:focus { outline: none; border-color: rgba(255,255,255,.5); background: rgba(0,0,0,.35); }

.btn-fl {
  background: rgba(255,255,255,.15);
  color: #fff;
  border: 1px solid rgba(255,255,255,.22);
  border-radius: 9px;
  padding: 10px 15px;
  font-size: 13px;
  font-weight: 600;
  font-family: var(--fb);
  cursor: pointer;
  white-space: nowrap;
  flex-shrink: 0;
}
.btn-fl:hover { background: rgba(255,255,255,.25); }
.btn-fl:disabled { opacity: .5; cursor: default; }

.fl-st {
  font-size: 13px;
  margin-top: 9px;
  min-height: 20px;
  line-height: 1.4;
  color: rgba(255,255,255,.65);
}
.fl-st.ok   { color: rgba(144,238,144,.95); }
.fl-st.err  { color: rgba(255,160,160,.85); }
.fl-st.info { color: rgba(255,255,255,.75); }

/* ── Camera error ────────────────────────────────────────────────── */
.cam-start {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
.cam-start[hidden] { display: none; }
.cam-err {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  padding: 28px;
  color: var(--muted);
  text-align: center;
}
.cam-err[hidden] { display: none; }
.cam-err p { font-size: 14px; line-height: 1.6; }

.m-row { display: flex; gap: 8px; width: 100%; max-width: 420px; }
.m-row input {
  flex: 1 1 0; min-width: 0;
  background: var(--surf);
  border: 1px solid var(--border);
  color: var(--fg);
  border-radius: 8px;
  padding: 10px 14px;
  font-size: 13px;
  font-family: var(--fb);
}
.m-row input::placeholder { color: var(--muted); }

.btn-accent {
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 8px;
  padding: 10px 16px;
  font-size: 13px;
  font-weight: 600;
  font-family: var(--fb);
  cursor: pointer;
  white-space: nowrap;
}
.btn-accent:hover { background: var(--accent2); }

/* ── Active list ─────────────────────────────────────────────────── */
.list-wrap {
  flex-shrink: 0;
  max-height: 210px;
  overflow-y: auto;
  padding: 2px 0 16px;
}

.list-label {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .09em;
  color: var(--muted);
  margin-bottom: 8px;
  font-family: var(--fb);
}

.list-empty { font-size: 13px; color: var(--muted); padding: 6px 0; }

.mrow {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--surf);
  border-radius: 8px;
  padding: 9px 12px;
  margin-bottom: 5px;
}

.mname {
  flex: 1 1 0;
  min-width: 0;
  font-size: 13px;
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.mname.known { color: var(--fg); }
.mname.anon  { color: var(--muted); font-style: italic; }

.mtime {
  font-size: 12px;
  color: var(--muted);
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}

.btn-done {
  background: none;
  border: 1px solid var(--border);
  color: var(--muted);
  border-radius: 6px;
  padding: 3px 9px;
  font-size: 11px;
  font-family: var(--fb);
  cursor: pointer;
  white-space: nowrap;
}
.btn-done:hover { color: var(--greenl); border-color: var(--greenl); }

/* ── Settings modal ──────────────────────────────────────────────── */
.mbg {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.75);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 50;
  padding: 16px;
}
.mbg[hidden] { display: none; }

.modal {
  background: var(--surf);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 24px;
  width: min(380px, 100%);
  max-height: calc(100vh - 32px);
  overflow-y: auto;
}

.modal h3 {
  font-family: var(--fd);
  font-size: 22px;
  font-weight: 700;
  color: var(--fg);
  margin-bottom: 20px;
}

.modal h4 {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .1em;
  color: var(--muted);
  margin: 20px 0 12px;
  padding-top: 16px;
  border-top: 1px solid var(--border);
  font-family: var(--fb);
}
.modal h4:first-of-type { margin-top: 0; padding-top: 0; border-top: none; }

.field { margin-bottom: 14px; }
.field label {
  display: block;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .08em;
  color: var(--muted);
  margin-bottom: 6px;
  font-family: var(--fb);
}

.field select, .field input[type=text], .field input[type=password], .field input[type=number] {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--fg);
  border-radius: 8px;
  padding: 10px 12px;
  font-size: 14px;
  font-family: var(--fb);
}
.field input[type=text]:focus,
.field input[type=password]:focus,
.field input[type=number]:focus {
  outline: none;
  border-color: var(--muted);
}
.field input::placeholder { color: var(--muted); opacity: 1; }

.field-hint {
  font-size: 11px;
  color: var(--muted);
  margin-top: 5px;
  line-height: 1.5;
}

.btn-danger {
  width: 100%;
  text-align: left;
  background: none;
  border: 1px solid var(--border);
  color: var(--muted);
  border-radius: 8px;
  padding: 10px 14px;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  font-family: var(--fb);
}
.btn-danger:hover { color: var(--redl); border-color: var(--redl); }
.btn-danger.confirm { color: var(--redl); border-color: var(--redl); }

.mfoot {
  display: flex;
  justify-content: flex-end;
  margin-top: 20px;
  padding-top: 16px;
  border-top: 1px solid var(--border);
}

.btn-close {
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--fg);
  border-radius: 8px;
  padding: 10px 18px;
  font-size: 14px;
  font-family: var(--fb);
  cursor: pointer;
}
.btn-close:hover { border-color: var(--muted); }
</style>

    <h3>Instellingen</h3>

    <h4>Tijdslimiet</h4>
    <div class="field">
      <label>Automatisch resetten na</label>
      <select id="tsel">
        <option value="2">2 uur</option>
        <option value="3">3 uur</option>

    <div class="field">
      <label>Club ID</label>
      <input type="number" id="sClubId" placeholder="87968" inputmode="numeric">
    </div>
    <div class="field">
      <label>API Key</label>

      <div class="field-hint">Via Virtuagym admin → Instellingen → API</div>
    </div>

    </div>
  </div>

<script>
// ── Storage ──────────────────────────────────────────────────────
const K  = 'sf_twl_v2';      // active towels: {[tokenKey]: {t, name, memberId?}}
const CK = 'sf_twl_cfg_v1';  // config: {h, clubId, apiKey, clubSecret}
const MK = 'sf_twl_mbrs_v1'; // persistent member cache: {[memberId]: "Full Name"}

const load = () => { try { return JSON.parse(localStorage.getItem(K)||'{}'); } catch { return {}; } };
const save = s => { try { localStorage.setItem(K, JSON.stringify(s)); } catch {} };

const cfg = () => {
  try { return JSON.parse(localStorage.getItem(CK) || '{"h":4}'); }
  catch { return {h:4}; }
};
const saveCfg = c => { try { localStorage.setItem(CK, JSON.stringify(c)); } catch {} };
const tms = () => cfg().h * 3_600_000;

const loadMembers = () => { try { return JSON.parse(localStorage.getItem(MK)||'{}'); } catch { return {}; } };
const saveMembers = m => { try { localStorage.setItem(MK, JSON.stringify(m)); } catch {} };

function active() {
  const s = load(), t = tms(), now = Date.now(), out = {};
  let changed = false;
  for (const k in s) {
    if (now - s[k].t < t) out[k] = s[k];
    else changed = true;
  }
  if (changed) save(out);
  return out;
}

// ── QR key & label ───────────────────────────────────────────────
function qrKey(data) {
  return data.replace('vg_checkin_qr=', '').replace(/[^a-zA-Z0-9]/g, '');
}

function lbl(key) {
  const s = key.replace(/[^a-zA-Z0-9]/g, '');
  return 'Lid ···' + s.slice(-8, -4) + ' ' + s.slice(-4).toUpperCase();
}

// ── Helpers ──────────────────────────────────────────────────────
function fLeft(issued) {
  const left = tms() - (Date.now() - issued);
  if (left <= 0) return 'verlopen';
  const m = Math.floor(left/60000), h = Math.floor(m/60), r = m%60;
  return h ? 'nog '+h+'u'+(r?' '+r+'m':'') : 'nog '+m+' min';
}

function fElapsed(ms) {
  const m = Math.floor(ms/60000), h = Math.floor(m/60), r = m%60;
  return h ? h+'u'+(r?' '+r+'m':'')+' geleden' : (m||1)+' min geleden';
}

// ── List ─────────────────────────────────────────────────────────
let rowKeys = [];

function render() {
  const m = active();
  rowKeys = Object.keys(m).sort((a,b) => m[b].t - m[a].t);
  document.getElementById('cnt').textContent = rowKeys.length;
  const el = document.getElementById('mlist');
  if (!rowKeys.length) {
    el.innerHTML = '<div class="list-empty">Geen handdoeken actief</div>';
    return;
  }
  el.innerHTML = rowKeys.map((k,i) => {
    const isKnown = m[k].name && !m[k].name.startsWith('Lid ···');
    return `<div class="mrow">
      <span class="mname ${isKnown?'known':'anon'}">${m[k].name || lbl(k)}</span>
      <span class="mtime">${fLeft(m[k].t)}</span>
      <button class="btn-done" data-i="${i}">Ingeleverd</button>
    </div>`;
  }).join('');
}

document.getElementById('mlist').addEventListener('click', e => {
  const b = e.target.closest('.btn-done');
  if (!b) return;
  const k = rowKeys[+b.dataset.i];
  if (!k) return;
  const s = load(); delete s[k]; save(s); render();
});

// ── Flash ────────────────────────────────────────────────────────
let flashTm = null, lastKey = null;

function hideFlash() {
  clearTimeout(flashTm);
  document.getElementById('flash').hidden = true;
  if (document.getElementById('camErr').hidden) {
    document.getElementById('guide').hidden = false;
  }
  render();
}

function pauseFlash() { clearTimeout(flashTm); }
function resumeFlash(ms=4000) { clearTimeout(flashTm); flashTm = setTimeout(hideFlash, ms); }

// Generic simple flash (for red/warn)
function showFlashSimple(type, title, sub, btns) {
  const el = document.getElementById('flash');
  el.className = 'flash ' + type;
  el.innerHTML = `
    <div class="fi">${type==='ok'?'✓':'✗'}</div>
    <div class="ft">${title}</div>
    <div class="fs">${sub}</div>
    <div class="fbtns">${btns}</div>`;
  el.hidden = false;
  document.getElementById('guide').hidden = true;
  resumeFlash(6000);
}

// Green flash with optional name-link section
function showFlashGreen(key, displayName) {
  const el = document.getElementById('flash');
  const shortLbl = lbl(key);
  el.className = 'flash ok';
  el.innerHTML = `
    <div class="fi">✓</div>
    <div class="ft">Handdoek uitgedeeld</div>
    <div class="fs" id="flName">${displayName}</div>
    <div class="fbtns">
      <button class="btn btn-w" data-a="ok">OK</button>
      <button class="btn btn-wr" data-a="undo">Ongedaan</button>
    </div>
    <div class="fl-link">
      <div class="fl-link-label">Naam koppelen (optioneel)</div>
      <div class="fl-link-row">
        <input class="fl-input" id="flMid" type="number" inputmode="numeric"
               placeholder="Lidnummer (bijv. 49332804)">
        <button class="btn-fl" id="flSearch">Zoeken</button>
      </div>
      <div class="fl-st info" id="flSt">Typ het Virtuagym-lidnummer van dit lid</div>
    </div>`;
  el.hidden = false;
  document.getElementById('guide').hidden = true;
  resumeFlash(8000);

  // Wire name-link section
  const inp = document.getElementById('flMid');
  const btn = document.getElementById('flSearch');

  inp.addEventListener('focus', pauseFlash);
  inp.addEventListener('blur', () => {
    const st = document.getElementById('flSt');
    if (!st || st.classList.contains('ok')) return;
    resumeFlash(6000);
  });
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') btn.click(); });
  btn.addEventListener('click', () => lookupMember(key));
}

document.getElementById('flash').addEventListener('click', e => {
  const a = e.target.closest('[data-a]')?.dataset.a;
  if (a === 'ok') { hideFlash(); }
  if (a === 'undo' && lastKey) {
    const s = load(); delete s[lastKey]; save(s);
    lastKey = null; lastQR = null; hideFlash();
  }
});

// ── Name lookup ──────────────────────────────────────────────────
async function lookupMember(key) {
  const midEl = document.getElementById('flMid');
  const stEl  = document.getElementById('flSt');
  if (!midEl || !stEl) return;

  const mid = midEl.value.trim();
  if (!mid) return;

  const btn = document.getElementById('flSearch');
  if (btn) btn.disabled = true;

  stEl.className = 'fl-st info';
  stEl.textContent = 'Zoeken…';

  // 1) Check persistent member cache first (instant, no API needed)
  const members = loadMembers();
  if (members[mid]) {
    saveLinkToKey(key, mid, members[mid], '✓ Uit ledenlijst: ');
    if (btn) btn.disabled = false;
    return;
  }

  // 2) Try Virtuagym API
  const c = cfg();
  if (c.apiKey && c.clubSecret) {
    try {
      const clubId = c.clubId || 87968;
      const url = `https://api.virtuagym.com/api/v1/club/${clubId}/member/${mid}?api_key=${encodeURIComponent(c.apiKey)}&club_secret=${encodeURIComponent(c.clubSecret)}`;
      const res = await fetch(url);
      if (res.ok) {
        const data = await res.json();
        const r = data.result || data;
        const fn = (r.first_name || '').trim();
        const ln = (r.last_name  || '').trim();
        const name = fn && ln ? fn + ' ' + ln : fn || ln || r.name || '';
        if (name) {
          saveLinkToKey(key, mid, name, '✓ Gevonden via Virtuagym: ');
          if (btn) btn.disabled = false;
          return;
        }
      }
      // API call succeeded but no name found
      showManualNameInput(key, mid, 'Lid niet gevonden (nr. ' + mid + '). Typ naam:');
    } catch {
      // CORS or network error
      showManualNameInput(key, mid, 'API niet bereikbaar. Typ naam handmatig:');
    }
  } else {
    // No API credentials — go straight to manual input
    showManualNameInput(key, mid, 'Geen API-sleutel ingesteld. Typ naam handmatig:');
  }

  if (btn) btn.disabled = false;
}

function showManualNameInput(key, mid, prompt) {
  const stEl = document.getElementById('flSt');
  if (!stEl) return;
  stEl.className = 'fl-st err';
  stEl.innerHTML = `<span>${prompt}</span>
    <div class="fl-link-row" style="margin-top:8px">
      <input class="fl-input" id="flManual" type="text" placeholder="Volledige naam" autocomplete="off">
      <button class="btn-fl" id="flSaveManual">Opslaan</button>
    </div>`;
  const inp = document.getElementById('flManual');
  const btn = document.getElementById('flSaveManual');
  if (inp) {
    inp.focus();
    inp.addEventListener('focus', pauseFlash);
    inp.addEventListener('blur', () => resumeFlash(6000));
    inp.addEventListener('keydown', e => { if (e.key === 'Enter' && btn) btn.click(); });
  }
  if (btn) {
    btn.addEventListener('click', () => {
      const name = inp ? inp.value.trim() : '';
      if (name) saveLinkToKey(key, mid, name, '✓ Naam opgeslagen: ');
    });
  }
}

function saveLinkToKey(key, mid, name, prefix = '✓ ') {
  // Persist in member cache (survives towel resets)
  const members = loadMembers();
  members[mid] = name;
  saveMembers(members);

  // Update towel entry
  const s = load();
  if (s[key]) { s[key].name = name; s[key].memberId = mid; }
  save(s);

  // Update flash display name
  const nameEl = document.getElementById('flName');
  if (nameEl) nameEl.textContent = name;

  // Update status
  const stEl = document.getElementById('flSt');
  if (stEl) {
    stEl.className = 'fl-st ok';
    stEl.textContent = prefix + name;
  }

  resumeFlash(3500);
  render();
}

// ── QR processing ────────────────────────────────────────────────
let lastQR = null, lastQRt = 0;

function processQR(data) {
  const now = Date.now();
  if (data === lastQR && now - lastQRt < 5000) return;
  if (!data.startsWith('vg_checkin_qr=')) return;
  lastQR = data; lastQRt = now;

  const key  = qrKey(data);
  const name = lbl(key);
  processWithKey(key, name, now);
}

function processWithKey(key, name, now) {
  const m = active();
  if (m[key]) {
    const displayName = m[key].name || name;
    showFlashSimple('warn',
      'Al een handdoek',
      displayName + '<br><span style="font-size:12px;opacity:.65">' + fElapsed(now - m[key].t) + '</span>',
      '<button class="btn btn-w" data-a="ok">Sluiten</button>'
    );
  } else {
    const s = load(); s[key] = { t: now, name }; save(s);
    lastKey = key; render();
    showFlashGreen(key, name);
  }
}

// ── Camera ───────────────────────────────────────────────────────
function camStartBtnClick() {
  document.getElementById('camStart').hidden = true;
  startCam();
}

async function startCam() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 } }
    });
    const v = document.getElementById('video');
    v.srcObject = stream;
    await v.play();
    document.getElementById('guide').hidden = false;
    scanLoop(v);
  } catch {
    document.getElementById('camStart').hidden = true;
    document.getElementById('camErr').hidden = false;
    document.getElementById('guide').hidden = true;
    document.getElementById('video').hidden = true;
  }
}

function scanLoop(v) {
  const c = document.getElementById('canvas');
  const ctx = c.getContext('2d');
  setInterval(() => {
    if (v.readyState < 2 || !document.getElementById('flash').hidden) return;
    c.width = v.videoWidth; c.height = v.videoHeight;
    ctx.drawImage(v, 0, 0);
    const img = ctx.getImageData(0, 0, c.width, c.height);
    const qr = jsQR(img.data, img.width, img.height, { inversionAttempts: 'dontInvert' });
    if (qr) processQR(qr.data);
  }, 200);
}

// Manual input (camera fallback)
document.getElementById('mbtn').addEventListener('click', () => {
  const v = document.getElementById('mqr').value.trim();
  if (v) { processQR(v); document.getElementById('mqr').value = ''; }
});
document.getElementById('mqr').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('mbtn').click();
});

// ── Settings ─────────────────────────────────────────────────────
document.getElementById('settingsBtn').addEventListener('click', () => {
  const c = cfg();
  document.getElementById('tsel').value = c.h || 4;
  document.getElementById('sClubId').value = c.clubId || '';
  document.getElementById('sApiKey').value = c.apiKey || '';
  document.getElementById('sClubSecret').value = c.clubSecret || '';
  document.getElementById('settingsBg').hidden = false;
});

function closeSettings() {
  const c = cfg();
  c.h = +document.getElementById('tsel').value || 4;
  const clubId = document.getElementById('sClubId').value.trim();
  const apiKey = document.getElementById('sApiKey').value.trim();
  const clubSecret = document.getElementById('sClubSecret').value.trim();
  if (clubId) c.clubId = +clubId;
  if (apiKey) c.apiKey = apiKey; else delete c.apiKey;
  if (clubSecret) c.clubSecret = clubSecret; else delete c.clubSecret;
  saveCfg(c);
  document.getElementById('settingsBg').hidden = true;
  render();
}

document.getElementById('closeBtn').addEventListener('click', closeSettings);
document.getElementById('settingsBg').addEventListener('click', e => {
  if (e.target === document.getElementById('settingsBg')) closeSettings();
});

// Reset towels (double-click confirm)
let resetConfirm = false, resetTm = null;
document.getElementById('resetBtn').addEventListener('click', () => {
  const btn = document.getElementById('resetBtn');
  if (resetConfirm) {
    save({}); closeSettings();
    resetConfirm = false;
    btn.textContent = 'Alle handdoeken als ingeleverd markeren';
    btn.classList.remove('confirm');
    clearTimeout(resetTm);
  } else {
    resetConfirm = true;
    btn.classList.add('confirm');
    btn.textContent = 'Nogmaals klikken om te bevestigen';
    resetTm = setTimeout(() => {
      resetConfirm = false;
      btn.textContent = 'Alle handdoeken als ingeleverd markeren';
      btn.classList.remove('confirm');
    }, 3000);
  }
});

// Clear member cache (double-click confirm)
let clearMbrsConfirm = false, clearMbrsTm = null;
document.getElementById('clearMembersBtn').addEventListener('click', () => {
  const btn = document.getElementById('clearMembersBtn');
  if (clearMbrsConfirm) {
    saveMembers({}); closeSettings();
    clearMbrsConfirm = false;
    btn.textContent = 'Ledenlijst wissen (namen cache)';
    btn.classList.remove('confirm');
    clearTimeout(clearMbrsTm);
  } else {
    clearMbrsConfirm = true;
    btn.classList.add('confirm');
    btn.textContent = 'Nogmaals klikken om namen te wissen';
    clearMbrsTm = setTimeout(() => {
      clearMbrsConfirm = false;
      btn.textContent = 'Ledenlijst wissen (namen cache)';
      btn.classList.remove('confirm');
    }, 3000);
  }
});

// ── Init ─────────────────────────────────────────────────────────
render();
setInterval(render, 60000);
</script>
